<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Arcade ist umgezogen</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12141f">
<link rel="canonical" href="https://neon-arcade-de.pages.dev/">
<noscript><meta http-equiv="refresh" content="0; url=https://neon-arcade-de.pages.dev/"></noscript>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d1c;color:#e8ecff;
       font:18px/1.5 system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  h1{color:#f0389d;font-size:22px} a{color:#22d3ee}
</style>
<script>
/* Neon Arcade ist am 06.10.2026 nach https://neon-arcade-de.pages.dev/ umgezogen. Der Browser speichert Highscores,
   Level, Profil und Konto getrennt nach Adresse – deshalb nimmt die Weiterleitung sie im #-Teil der Adresse mit
   (der wird nie an einen Server geschickt). Die neue Seite übernimmt sie einmal und entfernt sie sofort aus der Adresse. */
(function(){
  var NEU = "https://neon-arcade-de.pages.dev/", d = {}, n = 0;
  try{
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i), v = localStorage.getItem(k);
      if(/^(na_|neonstrike_)/.test(k) && !/^neonstrike_thumb_/.test(k) && v != null && v.length < 300000){ d[k] = v; n++; }
    }
  }catch(e){}
  var ziel = /^#umzug=/.test(location.hash) ? "" : location.hash, url = NEU + location.search;
  if(n){
    var b = new TextEncoder().encode(JSON.stringify(d)), s = "";
    for(var j = 0; j < b.length; j++) s += String.fromCharCode(b[j]);
    url += "#umzug=" + btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") + (ziel ? "&ziel=" + encodeURIComponent(ziel) : "");
  } else url += ziel;
  location.replace(url);
})();
</script>
<body>
<div>
  <h1>Neon Arcade ist umgezogen</h1>
  <p>Du wirst gleich weitergeleitet. Neue Adresse:<br>
  <a href="https://neon-arcade-de.pages.dev/">neon-arcade-de.pages.dev</a></p>
</div>
</body>
</html>
