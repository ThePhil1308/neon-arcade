(function(){
  var NEU = "https://neon-arcade-de.pages.dev/", d = {}, n = 0;
  try{
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i), v = localStorage.getItem(k);
      if(/^(na_|neonstrike_)/.test(k) && !/^neonstrike_thumb_/.test(k) && v != null && v.length < 300000){ d[k] = v; n++; }

  }catch(e){}
  var ziel = /^#umzug=/.test(location.hash) ? "" : location.hash, url = NEU + location.search;
  if(n){
    var b = new TextEncoder().encode(JSON.stringify(d)), s = "";
    for(var j = 0; j < b.length; j++) s += String.fromCharCode(b[j]);
    url += "#umzug=" + btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") + (ziel ? "&ziel=" + encodeURIComponent(ziel) : "");
  } else url += ziel;
  location.replace(url);
})();
